<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>EV Compare</title>
<!--
  GitHub Pages has no server-side rewrites, so a direct hit on a deep link like
  /2026/mustang-mach-e/gt-awd 404s before our app's own JS router ever runs. This is the
  standard workaround (rafgraph/spa-github-pages): encode the real path into a query string
  and redirect to index.html, which restores it via history.replaceState before rendering.

  pathSegmentsToKeep: how many leading path segments belong to the *site*, not the route.
  0 for a user/org root page (https://user.github.io/) or a custom domain at the root.
  1 for a GitHub Pages *project* page (https://user.github.io/evcompare/) — must match
  BASE_PATH in js/router.js.
-->
<script>
  var pathSegmentsToKeep = 1;
  var l = window.location;
  l.replace(
    l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
    l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") + "/?p=/" +
    l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
    (l.search ? "&q=" + l.search.slice(1).replace(/&/g, "~and~") : "") +
    l.hash
  );
</script>
</head>
<body></body>
</html>
