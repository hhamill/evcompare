<!-- Restores the real deep-link path that 404.html stashed in ?p= before our own router runs. See 404.html.
     Safe to run before the stylesheet/script tags below regardless of nesting depth, since every
     resource reference in this document is root-relative (a leading "/") rather than relying on a
     <base> tag or the document's own path — resolving root-relative paths doesn't care what
     location.pathname becomes, so there's no ordering hazard here to route around. -->
<script>
  (function (l) {
    if (l.search[1] === "p" && l.search[2] === "=") {
      var decoded = l.search.slice(3).split("&").map(function (s) { return s.replace(/~and~/g, "&"); }).join("?");
      window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
    }
  })(window.location);
</script>
