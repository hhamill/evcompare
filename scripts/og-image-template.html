<!--
  Source template for assets/og-image.png (the site-wide Open Graph / Twitter Card / Discord
  unfurl image) and assets/logo.png (the app's brand mark / favicon source). Not part of the
  build — these are one-time hand-authored assets, regenerated manually when the branding
  changes, not on every deploy.

  Two 8-bit pixel-art EVs face off left-to-right, drawn on a <canvas> from plain pixel-grid
  arrays (see CAR_RIGHT/CAR_LEFT below) and scaled up with imageSmoothingEnabled=false for
  crisp blocky edges — no image libraries, no external sprite assets, just JS drawing rects.
  Colors match the live app's own CSS custom properties (--accent green, --accent-2 blue).

  To regenerate both PNGs (no npm dependencies needed, just local Chrome):

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless --disable-gpu --hide-scrollbars --window-size=1200,630 \
      --screenshot="assets/og-image.png" \
      "file://$(pwd)/scripts/og-image-template.html#og"

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless --disable-gpu --hide-scrollbars --window-size=512,512 \
      --screenshot="assets/logo.png" \
      "file://$(pwd)/scripts/og-image-template.html#logo"

  1200x630 is the standard OG image size (1.91:1) — Twitter's summary_large_image card and
  Discord's embed both expect it. logo.png is generated square and downsized at use-time
  for the favicon.
-->
<!doctype html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  html, body { margin: 0; padding: 0; background: #0b0d12; }
  canvas { display: block; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const COLORS = {
  ".": null,
  B: "#4ee08a",   // car A body (--accent)
  D: "#2c8f5c",   // car A shadow (--accent-dim)
  L: "#a8f5c9",   // car A highlight
  b: "#5aa2ff",   // car B body (--accent-2)
  d: "#3a6fc4",   // car B shadow
  l: "#b9d6ff",   // car B highlight
  W: "#eef1f6",   // near window (windshield side)
  V: "#8fb8cc",   // far window (rear glass, slightly darker/duller)
  X: "#ffffff",   // window reflection accent
  K: "#4a5164",   // tire (mid-gray — visible against the dark background)
  k: "#9aa4b6",   // hubcap highlight
  H: "#fff3b0",   // headlight
  R: "#ff6b6b",   // taillight
};

// 30 wide x 15 tall, facing RIGHT (headlight at the far column). Second pass at this sprite —
// the original 24x12 version read as too pointy/triangular (the roof-to-hood and hood-to-nose
// transitions were single-step tapers). This one uses a proper stepped "shoulder" (two width
// tiers between the cabin and the full-width body) for a rounder silhouette, a two-tone window
// (near/far glass) with a reflection pixel, and a door-line panel break, closer to how a hand-
// drawn 8-bit car sprite actually breaks up its panels rather than one flat block of body color.
const CAR_RIGHT = [
  "..........LLLLLLLL............",
  ".........BVVVVBWWWB...........",
  ".........BVVVVBWXWB...........",
  ".......BBBBBBBBBBBBBB.........",
  ".....BBBBBBBBBBBBBBBBBBB......",
  "..RBBBBBBBBBBBBBBBBBBBBBBBBBH.",
  "..RBBBBBBBBBBBBBBDBBBBBBBBBBH.",
  "..RBBBBBBBBBBBBBBDBBBBBBBBBBH.",
  "...BBBBBBBBBBBBBBBBBBBBBBBBB..",
  "...DDDDDDDDDDDDDDDDDDDDDDDDD..",
  "...DDDDDDDDDDDDDDDDDDDDDDDDD..",
  "....KKKKKKK.........KKKKKKK...",
  "....K.kkk.K.........K.kkk.K...",
  "....K.kkk.K.........K.kkk.K...",
  "....KKKKKKK.........KKKKKKK...",
];

function mirror(row) { return row.split("").reverse().join(""); }
// Only the body/shadow/highlight chars get recolored to the blue palette (b/d/l) — window,
// wheel, headlight, and taillight colors are shared between both cars and stay as-is.
const RECOLOR = { B: "b", D: "d", L: "l" };
function recolor(ch) { return RECOLOR[ch] || ch; }

// Car B: mirrored (faces LEFT) and recolored to the blue palette.
const CAR_LEFT = CAR_RIGHT.map(row => mirror(row).split("").map(recolor).join(""));

function drawSprite(ctx, grid, ox, oy, px) {
  for (let y = 0; y < grid.length; y++) {
    for (let x = 0; x < grid[y].length; x++) {
      const c = COLORS[grid[y][x]];
      if (!c) continue;
      ctx.fillStyle = c;
      ctx.fillRect(ox + x * px, oy + y * px, px, px);
    }
  }
}

const BOLT_SHAPE = [
  "..LL",
  ".LL.",
  "LLLL",
  "..LL",
  ".LL.",
  "LL..",
];

function drawBolt(ctx, ox, oy, px, color) {
  for (let y = 0; y < BOLT_SHAPE.length; y++) {
    for (let x = 0; x < BOLT_SHAPE[y].length; x++) {
      if (BOLT_SHAPE[y][x] === ".") continue;
      ctx.fillStyle = color;
      ctx.fillRect(ox + x * px, oy + y * px, px, px);
    }
  }
}

// Same proven zigzag as drawBolt, drawn three times at decreasing size and increasing
// brightness (outer orange -> mid yellow -> white core), centered on one point — a layered
// glow instead of one flat color. (cx, cy) is the shape's visual center, not a top-left corner.
function drawBoltGlow(ctx, cx, cy, basePx) {
  const layers = [
    { mult: 1.4, color: "#ff9900" },
    { mult: 1.15, color: "#ffe066" },
    { mult: 1.0, color: "#ffffff" },
  ];
  const gw = BOLT_SHAPE[0].length, gh = BOLT_SHAPE.length;
  for (const { mult, color } of layers) {
    const px = basePx * mult;
    drawBolt(ctx, cx - (gw * px) / 2, cy - (gh * px) / 2, px, color);
  }
}

// Standalone brand-mark bolt (favicon / topbar badge scale) — the same zigzag already proven
// to read correctly as the small "vs" divider in the OG image (see `bolt` in drawBolt above),
// just doubled in resolution (each cell -> 2x2) for more shading detail at this larger size.
// 8 wide x 12 tall.
const BOLT_ICON = [
  "....FFFS",
  "....FFFS",
  "..FFFS..",
  "..FFFS..",
  "FFFFFFFS",
  "FFFFFFFS",
  "....FFFS",
  "....FFFS",
  "..FFFS..",
  "..FFFS..",
  "FFFS....",
  "FFFS....",
];
const BOLT_ICON_COLORS = { ".": null, F: "#fff3b0", S: "#e0a940" };

function drawBoltIcon(ctx, ox, oy, px) {
  for (let y = 0; y < BOLT_ICON.length; y++) {
    for (let x = 0; x < BOLT_ICON[y].length; x++) {
      const c = BOLT_ICON_COLORS[BOLT_ICON[y][x]];
      if (!c) continue;
      ctx.fillStyle = c;
      ctx.fillRect(ox + x * px, oy + y * px, px, px);
    }
  }
}

const mode = location.hash.slice(1) || "og";
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
ctx.imageSmoothingEnabled = false;

if (mode === "icon") {
  // Preview only, at large scale, on the same diagonal gradient the real .brand-mark badge
  // uses — for checking legibility before deriving the actual SVG markup from BOLT_ICON.
  canvas.width = 300;
  canvas.height = 300;
  const grad = ctx.createLinearGradient(0, 0, 300, 300);
  grad.addColorStop(0, "#4ee08a");
  grad.addColorStop(1, "#5aa2ff");
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 300, 300);
  const px = 300 / 16;
  const w = 8 * px, h = 12 * px;
  drawBoltIcon(ctx, (300 - w) / 2, (300 - h) / 2, px);
} else if (mode === "og") {
  // 1200x600 (2:1) rather than 1200x630 (1.91:1) — still squarely within the standard OG/
  // Twitter range (Twitter's own docs prefer 2:1 for summary_large_image), just shorter so the
  // content fills the frame instead of floating in a lot of dark empty space top-to-bottom.
  canvas.width = 1200;
  canvas.height = 600;

  ctx.fillStyle = "#0b0d12";
  ctx.fillRect(0, 0, 1200, 600);

  // Retro horizon glow — a few violet bars narrowing toward a vanishing point, filling the
  // gap between the title and the cars. Kept well clear of the tagline text below the cars
  // (no grid lines crossing that zone) so it reads as atmosphere, not clutter.
  const horizonBars = [
    [430, 122, 340, 6, "#221839"],
    [470, 130, 260, 6, "#2c1e4a"],
    [510, 138, 180, 6, "#38255c"],
    [550, 146, 100, 6, "#48306f"],
  ];
  for (const [x, y, w, h, color] of horizonBars) {
    ctx.fillStyle = color;
    ctx.fillRect(x, y, w, h);
  }
  ctx.fillStyle = "#1c2540";
  ctx.fillRect(0, 369, 1200, 2);

  const px = 11;
  const carAX = 110, carBX = 760, carY = 190;
  const carW = CAR_RIGHT[0].length * px, carH = CAR_RIGHT.length * px;

  ctx.fillStyle = "rgba(0,0,0,0.35)";
  ctx.beginPath();
  ctx.ellipse(carAX + carW / 2, carY + carH + 22, 155, 16, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(carBX + carW / 2, carY + carH + 22, 155, 16, 0, 0, Math.PI * 2);
  ctx.fill();

  drawSprite(ctx, CAR_RIGHT, carAX, carY, px);
  drawSprite(ctx, CAR_LEFT, carBX, carY, px);
  drawBoltGlow(ctx, (carAX + carW + carBX) / 2, carY + carH / 2, 11);

  ctx.textAlign = "center";
  ctx.fillStyle = "#eef1f6";
  ctx.font = "800 64px -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif";
  ctx.fillText("EV COMPARE", 600, 100);

  ctx.fillStyle = "#9aa4b6";
  ctx.font = "500 28px -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif";
  ctx.fillText("Filter and compare electric vehicles side by side", 600, 505);
} else if (mode === "header") {
  // A small standalone composition for the topbar, not a crop of the wide "og" scene — the two
  // cars there are spaced out for a 1200-wide banner (roughly 4.5:1 just for the pair), so
  // cropping down to an icon-ish ratio would either clip most of both cars or shrink them to
  // nothing. Same CAR_RIGHT/CAR_LEFT/bolt data and drawSprite/drawBolt functions as "og" though
  // — just laid out tighter, at a smaller px scale, so it can't visually diverge from the real
  // artwork. Transparent background so it sits naturally on the topbar in either theme.
  document.body.style.background = "transparent"; // override the shared dark <body> rule above
  const px = 3;
  const carW = CAR_RIGHT[0].length * px, carH = CAR_RIGHT.length * px; // 72 x 36
  const gap = 16;
  canvas.width = carW * 2 + gap + 8;
  canvas.height = carH + 8;

  drawSprite(ctx, CAR_RIGHT, 4, 4, px);
  drawSprite(ctx, CAR_LEFT, 4 + carW + gap, 4, px);
  drawBolt(ctx, 4 + carW + gap / 2 - 6, 4 + carH / 2 - 9, 3, "#eef1f6");
} else {
  canvas.width = 512;
  canvas.height = 512;

  ctx.fillStyle = "#0b0d12";
  ctx.fillRect(0, 0, 512, 512);
  const horizonBars = [
    [156, 132, 200, 4, "#221839"],
    [176, 138, 160, 4, "#2c1e4a"],
    [196, 144, 120, 4, "#38255c"],
    [216, 150, 80, 4, "#48306f"],
  ];
  for (const [x, y, w, h, color] of horizonBars) {
    ctx.fillStyle = color;
    ctx.fillRect(x, y, w, h);
  }

  // Just car A, centered, for a larger brand-mark asset (README/social-profile scale — the
  // browser-tab favicon itself stays the simple bolt SVG already in index.html, since a full
  // sprite this detailed won't read at 16-32px).
  const px = 11;
  const w = CAR_RIGHT[0].length * px;
  const h = CAR_RIGHT.length * px;
  const ox = (512 - w) / 2;
  const oy = (512 - h) / 2 - 6;

  ctx.fillStyle = "rgba(0,0,0,0.35)";
  ctx.beginPath();
  ctx.ellipse(256, oy + h + 14, w * 0.42, 16, 0, 0, Math.PI * 2);
  ctx.fill();

  drawSprite(ctx, CAR_RIGHT, ox, oy, px);
}
</script>
</body>
</html>
