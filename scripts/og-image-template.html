<!--
  Source template for assets/og-image.png (the site-wide Open Graph / Twitter Card / Discord
  unfurl image) and assets/logo.png (a square, larger-scale render of the same mark, for
  README/social-profile use). Not part of the build — these are one-time hand-authored assets,
  regenerated manually when the branding changes, not on every deploy.

  Draws the same split-circle-and-bolt mark used for the real favicon/topbar brand-mark (see
  index.html / scripts/prerender.mjs) at a larger scale, via drawBrandMark() below — same
  relative geometry (a circle clipped into green/blue halves with a dark bolt over the middle),
  just scaled up on a <canvas> instead of inline SVG, so this asset can never visually drift
  from the real mark the way the old two-pixel-car race scene eventually did.

  To regenerate both PNGs (no npm dependencies needed, just local Chrome):

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless --disable-gpu --hide-scrollbars --window-size=1200,630 \
      --screenshot="assets/og-image.png" \
      "file://$(pwd)/scripts/og-image-template.html#og"

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless --disable-gpu --hide-scrollbars --window-size=512,512 \
      --screenshot="assets/logo.png" \
      "file://$(pwd)/scripts/og-image-template.html#logo"

  1200x630 is the standard OG image size (1.91:1) — Twitter's summary_large_image card and
  Discord's embed both expect it. logo.png is generated square and downsized at use-time
  for other social/profile contexts.
-->
<!doctype html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  html, body { margin: 0; padding: 0; background: #0b0d12; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Draws the brand mark centered at (cx, cy) with the given circle radius — same relative
// geometry as the real mark's 32x32 SVG viewBox (circle r=15 centered at 16,16, clipped into
// green/blue halves, dark bolt polygon over the middle), just scaled/translated into place.
// `scale` is radius / 15 so callers can just pick a target on-canvas radius.
function drawBrandMark(ctx, cx, cy, radius) {
  const scale = radius / 15;
  ctx.save();
  ctx.translate(cx - scale * 16, cy - scale * 16);
  ctx.scale(scale, scale);

  ctx.save();
  ctx.beginPath();
  ctx.arc(16, 16, 15, 0, Math.PI * 2);
  ctx.clip();
  ctx.fillStyle = "#4ee08a";
  ctx.fillRect(0, 0, 16, 32);
  ctx.fillStyle = "#5aa2ff";
  ctx.fillRect(16, 0, 16, 32);
  ctx.restore();

  ctx.beginPath();
  ctx.moveTo(18.4, 8);
  ctx.lineTo(10.4, 17.6);
  ctx.lineTo(15.2, 17.6);
  ctx.lineTo(13.6, 24);
  ctx.lineTo(21.6, 12.8);
  ctx.lineTo(16.8, 12.8);
  ctx.closePath();
  ctx.fillStyle = "#06110a";
  ctx.fill();

  ctx.restore();
}

const mode = location.hash.slice(1) || "og";
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

if (mode === "og") {
  // 1200x600 (2:1) rather than 1200x630 (1.91:1) — still squarely within the standard OG/
  // Twitter range (Twitter's own docs prefer 2:1 for summary_large_image), just shorter so the
  // content fills the frame instead of floating in a lot of dark empty space top-to-bottom.
  canvas.width = 1200;
  canvas.height = 600;

  ctx.fillStyle = "#0b0d12";
  ctx.fillRect(0, 0, 1200, 600);

  const markRadius = 90;
  const gap = 28;
  const wordmarkFont = "700 68px -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif";
  ctx.font = wordmarkFont;
  const wordmarkWidth = ctx.measureText("EV Compare").width;
  const lockupWidth = markRadius * 2 + gap + wordmarkWidth;
  const lockupStartX = (1200 - lockupWidth) / 2;
  const markCx = lockupStartX + markRadius;
  const markCy = 250;

  drawBrandMark(ctx, markCx, markCy, markRadius);

  ctx.textAlign = "left";
  ctx.textBaseline = "middle";
  ctx.fillStyle = "#eef1f6";
  ctx.font = wordmarkFont;
  ctx.fillText("EV Compare", lockupStartX + markRadius * 2 + gap, markCy);

  ctx.textAlign = "center";
  ctx.textBaseline = "alphabetic";
  ctx.fillStyle = "#9aa4b6";
  ctx.font = "500 28px -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif";
  ctx.fillText("View and compare electric vehicles sold in the US", 600, 410);
} else {
  canvas.width = 512;
  canvas.height = 512;

  ctx.fillStyle = "#0b0d12";
  ctx.fillRect(0, 0, 512, 512);

  drawBrandMark(ctx, 256, 256, 200);
}
</script>
</body>
</html>
